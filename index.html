<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawnchy Mune-Ath</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 720px;
      padding: 1rem;
    }

    .card {
      display: flex;
      align-items: center; 
      gap: 2rem;
    }

    .card img {
      width: 240px;
      height: 240px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 0;
    }

    .info {
      flex: 1;
      text-align: left;
    }

    .info h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
    }

    .info p,
    .info li {
      margin: 0.25rem 0;
      line-height: 1.3;
      font-size: 0.95rem;
    }

    ul {
      margin: 0.25rem 0;
      padding-left: 1.2rem;
    }

    ul li {
      margin: 0.15rem 0;
    }

    a {
      color: #0041a8;
      text-decoration: underline;
    }

    a:hover {
      color: #002d7e;
    }

    @media (max-width: 600px) {
      .card {
        flex-direction: column;
        text-align: left;
        align-items: flex-start;
      }

      .card img {
        margin-bottom: 1rem;
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <div class="info">
        <h1>Pawnchy Mune-Ath</h1>
        <p>
          <a href="mailto:pjmuneath@gmail.com">email</a> ·
          <a href="https://linkedin.com/in/pawnchy-muneath">linkedin</a>
        </p>
        <p>passionate about purpose-driven ai and the inherent beauty of humanity.</p>
        <p><b>past work →</b></p>
        <ul>
		  <li>may 2025 - now (verity lab ai): qc lead @ ai gaming startup</li>
          <li>feb 2025 (project): <a href="https://pjmuneath.github.io/crypto">digital asset volume forecast</a></li>
        </ul>
      </div>
	      <img src="assets/1.jpg" alt="portrait" />
    </section>
  </main>
</body>
</html>
